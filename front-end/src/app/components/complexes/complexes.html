<div class="complex-list">

    @for (item of complex$ | async; track item.id)
    {
    <app-complex-card photo={{item.photo}} name={{item.name}} city={{item.city}} country={{item.country}}
        openTime={{item.open_time}} closeTime={{item.close_time}} price="5 $/hrs" (click)=pickComplex(item.id)
        [rating]="4.5">
    </app-complex-card>
    }
</div>
