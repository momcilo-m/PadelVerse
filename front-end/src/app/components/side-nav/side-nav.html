<mat-toolbar color="primary" style="max-height: 30px; padding: 25px 10px;">
  <button mat-icon-button (click)="toggleSidenav()">
    <mat-icon>menu</mat-icon>
  </button>
  <a href="/" class="no-link"><span>Padel Verse</span></a>
</mat-toolbar>

<!-- style="max-width: 1600px !important; margin: auto;" -->

<mat-sidenav-container class="sidenav-container">

  <mat-sidenav #sidenav mode="side" class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/complex" routerLinkActive="active">
        <mat-icon>travel_explore</mat-icon>
        <span>Complex</span>
      </a>
      <a mat-list-item routerLink="/maps" routerLinkActive="active">
        <mat-icon>map</mat-icon>
        <span>Map</span>
      </a>
      <a mat-list-item routerLink="/profile" routerLinkActive="active">
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </a>

      <a mat-list-item routerLink="/management" routerLinkActive="active">
        <mat-icon>book</mat-icon>
        <span>Management</span>
      </a>

    </mat-nav-list>
  </mat-sidenav>


  <mat-sidenav-content class="sidenav-content">
    <main>
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
