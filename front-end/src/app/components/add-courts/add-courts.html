<!-- <h2 mat-dialog-title>Hi {{data.name}}</h2> -->
<mat-dialog-content>
    <h3>Let's create your court?</h3>
    <mat-form-field>
        <mat-label>Court Name</mat-label>
        <input matInput [(ngModel)]="name" />
    </mat-form-field>

    <mat-form-field>
        <mat-label>Price:</mat-label>
        <input matInput id="price" name="price" [(ngModel)]="price" required />
    </mat-form-field>

</mat-dialog-content>
<mat-dialog-actions>
    <button matButton (click)="addCourt()" cdkFocusInitial>Ok</button>
</mat-dialog-actions>
